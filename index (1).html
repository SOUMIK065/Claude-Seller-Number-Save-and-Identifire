<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Creavy Calls</title>
<meta name="description" content="Creavy seller call tracker: no repeat calls, callback reminders and notes.">
<meta name="theme-color" content="#a8431f" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#18120e" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Creavy Calls">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --ground:#f7f1e9;--surface:#fffdf9;--ink:#2b1e16;--muted:#6b584a;--line:#e5d9ca;--edge:#8d7a6b;
  --clay:#b04a27;--on-clay:#fff;--hero:#a8431f;--peach:#ea9469;--haldi:#f0ab12;--on-haldi:#2a1d00;
  --madder:#b3283f;--neem:#26744f;--amber:#8f5a06;--sea:#0b6f86;--jamun:#74408f;--ocean:#2b59a3;--slate:#6b584a;
  --focus:#2b59a3;--shadow:rgba(60,30,10,.35);
}
@media (prefers-color-scheme:dark){:root{
  --ground:#18120e;--surface:#241a14;--ink:#f5ece2;--muted:#bfaa97;--line:#3b2d23;--edge:#8a7563;
  --clay:#ea9469;--on-clay:#2b1a10;--hero:#7c3419;--haldi:#f3b533;
  --madder:#f08090;--neem:#5cc08f;--amber:#f0b84a;--sea:#52c3dc;--jamun:#c79be0;--ocean:#8fb0ee;--slate:#bfaa97;
  --focus:#9fc0ff;--shadow:rgba(0,0,0,.6);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari",sans-serif;overscroll-behavior-y:none}
body.lock{overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p,ul,ol{margin:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.t-green{--c:var(--neem)}.t-red{--c:var(--madder)}.t-amber{--c:var(--amber)}.t-teal{--c:var(--sea)}.t-violet{--c:var(--jamun)}.t-gray{--c:var(--slate)}.t-blue{--c:var(--ocean)}
.mt{margin-top:10px}.mt2{margin-top:22px}
.hint{font-size:14px;color:var(--muted)}
.row{display:flex;align-items:center;gap:8px}.wrap{flex-wrap:wrap}.sp{flex:1}
.ic{flex:none}

#app{max-width:640px;margin:0 auto}
header{position:sticky;top:0;z-index:5;background:var(--ground);padding:calc(env(safe-area-inset-top) + 12px) 16px 10px}
header h1{font:700 24px/1.1 Georgia,"Noto Serif","Iowan Old Style",serif;color:var(--clay)}
header p{font-size:14px;color:var(--muted);margin-top:3px;min-height:20px}
main{padding:4px 16px 170px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:46px;padding:0 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-weight:650;text-align:center;white-space:nowrap}
.btn.block{white-space:normal}
.btn.sm{min-height:40px;padding:0 13px;font-size:15px}
.btn.pri{background:var(--clay);border-color:var(--clay);color:var(--on-clay)}
.btn.haldi{background:var(--haldi);border-color:var(--haldi);color:var(--on-haldi)}
.btn.danger{color:var(--madder);border-color:var(--madder);background:transparent}
.btn.quiet{border-color:transparent;background:transparent;color:var(--muted)}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.fab{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom) + 76px);z-index:7;display:flex;align-items:center;gap:8px;min-height:52px;padding:0 20px 0 16px;border-radius:26px;border:0;background:var(--clay);color:var(--on-clay);font-weight:700;box-shadow:0 6px 18px var(--shadow)}

/* bottom nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav .in{max-width:640px;margin:0 auto;display:flex}
nav button{flex:1;position:relative;border:0;background:none;padding:9px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:12px;font-weight:650}
nav button.on{color:var(--clay)}
nav button.on::before{content:"";position:absolute;top:0;left:32%;right:32%;height:3px;border-radius:0 0 3px 3px;background:var(--peach)}
nav .ico{display:flex;height:24px;align-items:center}
nav em{position:absolute;top:3px;left:calc(50% + 9px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--madder);color:#fff;font:700 11px/18px system-ui,sans-serif;text-align:center}

/* the call-next card: a block-print dot lattice, the one decorative thing */
.hero{position:relative;overflow:hidden;color:#fff;border-radius:20px;padding:18px 18px 16px;margin:6px 0 6px;
  background:radial-gradient(circle at 14px 14px,rgba(255,255,255,.2) 2.2px,transparent 2.8px) 0 0/28px 28px,
             radial-gradient(circle at 50% 50%,rgba(255,255,255,.12) 3.4px,transparent 4px) 14px 14px/28px 28px,
             var(--hero)}
.hero .kick{font-size:15px;opacity:.88}
.hero .big{font:700 28px/1.15 Georgia,"Noto Serif","Iowan Old Style",serif;margin:6px 0 2px;overflow-wrap:anywhere}
.hero .num{font-size:21px;font-variant-numeric:tabular-nums;letter-spacing:.03em}
.hero .pl{margin-top:10px}
.hero .pill{display:inline-block;background:var(--haldi);color:var(--on-haldi);font-weight:700;font-size:14px;padding:2px 11px;border-radius:999px}
.hero .hn{margin-top:10px;font-size:15px;opacity:.92;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.hero .go{margin-top:16px}
.hero .more{margin-top:10px;font-size:14px;opacity:.85;text-align:center}
.how{padding-left:20px;margin-top:16px;color:var(--ink)}.how li{margin:6px 0}

/* contact rows: one grouped list, colour stripe = status */
.sec{display:flex;align-items:center;gap:8px;font:700 19px/1.2 Georgia,"Noto Serif","Iowan Old Style",serif;margin:22px 2px 8px}
.sec .count{font:600 13px system-ui,sans-serif;background:var(--line);color:var(--muted);padding:1px 9px;border-radius:999px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.item{position:relative;padding:12px 14px 12px 19px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--bar,var(--c,var(--line)))}
.item.t-amber{--bar:var(--haldi)}
.item .top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.item .nm{font-weight:650;font-size:17px;overflow-wrap:anywhere}
.item .ph{font-variant-numeric:tabular-nums;color:var(--muted);letter-spacing:.02em}
.item .sub,.item .meta{font-size:14px;color:var(--muted)}
.item .cb{display:flex;align-items:center;gap:6px;margin-top:5px;font-size:14px;font-weight:650;color:var(--amber)}
.item .cb.over{color:var(--madder)}
.item .cb .ic{width:16px;height:16px}
.item .note{margin-top:6px;font-size:15px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.item .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.item .acts .btn.sm{padding:0 11px}
.chip{flex:none;display:inline-flex;align-items:center;font-size:13px;font-weight:650;padding:2px 10px;border-radius:999px;color:var(--c,var(--slate));background:rgba(107,88,74,.14);background:color-mix(in srgb,var(--c,var(--slate)) 14%,transparent)}
.empty{padding:30px 14px;text-align:center;color:var(--muted)}
.chiprow{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:14px;margin:12px 0 0;background:var(--surface);border:1px solid var(--line);font-size:15px}
.banner span{flex:1;min-width:0}
.banner .btn{flex:none}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.panel h3{font:700 17px/1.2 Georgia,"Noto Serif","Iowan Old Style",serif;margin-bottom:6px}
.panel p{margin:6px 0}
.panel .row{margin-top:10px}

/* forms */
label{display:block;font-size:14px;font-weight:650;color:var(--muted);margin:14px 0 5px}
input[type=text],input[type=tel],input[type=search],input[type=datetime-local],textarea,select{width:100%;min-height:46px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--edge);background:var(--surface);color:var(--ink)}
input:focus,textarea:focus,select:focus{border-color:var(--focus);outline:none}
.row input[type=text]{flex:1;min-width:0;width:auto}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.tag{font-size:13px;line-height:1.35;padding:1px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface)}
.tag.cat{color:var(--clay);border-color:var(--clay);border-color:color-mix(in srgb,var(--clay) 50%,var(--line))}
.item .why{margin-top:2px;font-size:14px}
textarea{min-height:96px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.alert{padding:10px 12px;border-radius:12px;margin-top:10px;font-size:15px;border:1px solid var(--line);background:var(--surface)}
.alert.warn{border-color:var(--haldi);background:color-mix(in srgb,var(--haldi) 14%,var(--surface))}
.alert.bad{border-color:var(--madder);background:color-mix(in srgb,var(--madder) 10%,var(--surface))}
.alert.ok{border-color:var(--neem);background:color-mix(in srgb,var(--neem) 10%,var(--surface))}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:none;padding:10px;border-radius:9px;font-weight:650;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{display:flex;align-items:center;gap:9px;min-height:56px;padding:8px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);text-align:left;font-weight:650;font-size:15px;line-height:1.2}
.opt::before{content:"";flex:none;width:11px;height:11px;border-radius:50%;background:var(--bar,var(--c))}
.opt.t-amber{--bar:var(--haldi)}
.opt.sel{border-color:var(--bar,var(--c));background:color-mix(in srgb,var(--bar,var(--c)) 14%,var(--surface));box-shadow:inset 0 0 0 1px var(--bar,var(--c))}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pick{flex:none;white-space:nowrap;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 13px;font-size:15px;font-weight:600;border-radius:999px}
.pick.sel{background:var(--clay);color:var(--on-clay);border-color:var(--clay)}
.hist{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}

/* sheets, dialogs, toast */
.backdrop{position:fixed;inset:0;z-index:20;background:rgba(30,16,8,.55);display:flex;align-items:flex-end;justify-content:center}
.backdrop.center{align-items:center;z-index:30}
.sheet{background:var(--ground);width:100%;max-width:640px;max-height:92vh;max-height:92dvh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:up .18s ease-out}
.sheet-head{display:flex;align-items:flex-start;gap:8px;padding:16px 16px 6px}
.sheet-head h2{font:700 21px/1.2 Georgia,"Noto Serif","Iowan Old Style",serif}
.sheet-head .ph{color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums}
.sheet-body{overflow:auto;padding:2px 16px 18px;-webkit-overflow-scrolling:touch}
.sheet-foot{display:flex;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--ground)}
.sheet-foot .btn{flex:1}
@keyframes up{from{transform:translateY(24px);opacity:.5}to{transform:none;opacity:1}}
.dlg{background:var(--surface);color:var(--ink);border-radius:18px;max-width:420px;width:calc(100% - 32px);padding:20px 18px 16px;margin:auto}
.dlg h3{font:700 20px/1.2 Georgia,"Noto Serif","Iowan Old Style",serif;color:var(--c,var(--ink))}
.dlg .dm{margin-top:8px}
.dlg .dm ul{padding-left:18px;margin:6px 0}
.dlg .dbtns{display:flex;flex-direction:column;gap:8px;margin-top:16px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 142px);z-index:40;display:flex;align-items:center;gap:14px;max-width:calc(100% - 32px);padding:11px 16px;border-radius:14px;background:#2b1e16;color:#fff;font-size:15px;box-shadow:0 6px 18px var(--shadow)}
#toast button{border:0;background:none;color:var(--haldi);font-weight:700;padding:4px 0;white-space:nowrap}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
</style>
</head>
<body>
<div id="app">
  <header><h1>Creavy Calls</h1><p id="sum"></p></header>
  <main id="view"></main>
</div>
<button id="fab" class="fab" data-act="add"></button>
<nav aria-label="Main"><div class="in">
  <button data-act="tab" data-tab="today"><span class="ico"></span><span>Today</span><em hidden></em></button>
  <button data-act="tab" data-tab="queue"><span class="ico"></span><span>Calling list</span><em hidden></em></button>
  <button data-act="tab" data-tab="called"><span class="ico"></span><span>Called</span><em hidden></em></button>
  <button data-act="tab" data-tab="settings"><span class="ico"></span><span>Settings</span><em hidden></em></button>
</div></nav>
<div id="layer"></div>
<div id="dlgRoot"></div>
<div id="toast" hidden></div>
<input type="file" id="file" accept=".json,application/json" hidden>

<script>
'use strict';
/* ================= LOGIC: pure helpers ================= */
const MIN=6e4,HOUR=36e5,DAY=864e5;

// What the seller said on a call. "final" = no reminder needed. "dnc" = do not call again.
// The order here is the order of the buttons in the "What did the seller say?" sheet.
const OUTCOMES={
  interested:{label:'Interested',tone:'green'},
  notint:{label:'Not interested',tone:'red',final:true,dnc:true},
  callback:{label:'Call back later',tone:'amber',needsTime:true},
  noanswer:{label:'No answer, busy or off',tone:'gray'},
  docs:{label:'Will send photos or documents',tone:'blue'},
  whatsapp:{label:'Send details on WhatsApp',tone:'teal'},
  lang:{label:'Language problem',tone:'violet'},
  wrong:{label:'Wrong number',tone:'red',final:true,dnc:true},
  joined:{label:'Joined Creavy',tone:'green',final:true},
  other:{label:'Other reply',tone:'gray'}
};
const BUILTIN_LABELS=Object.keys(OUTCOMES).map(k=>OUTCOMES[k].label.toLowerCase());
const isOutcome=k=>Object.prototype.hasOwnProperty.call(OUTCOMES,k);
const STATUS={
  new:{label:'Not called yet',tone:'gray'},
  dialed:{label:'Reply not logged',tone:'amber'}
};
const info=st=>STATUS[st]||(isOutcome(st)?OUTCOMES[st]:STATUS.new);
// Reply options the user adds in Settings. They live in db.settings.custom and are added to OUTCOMES at start.
const cleanCustom=a=>Array.isArray(a)?a.filter((o,i)=>o&&/^x[a-z0-9]{3,16}$/.test(o.k)&&typeof o.label==='string'&&o.label.trim()&&a.findIndex(p=>p&&p.k===o.k)===i).slice(0,8).map(o=>({k:o.k,label:o.label.trim().slice(0,40)})):[];
function setCustom(list){
  Object.keys(OUTCOMES).forEach(k=>{if(OUTCOMES[k].custom)delete OUTCOMES[k];});
  list.forEach(o=>{OUTCOMES[o.k]={label:o.label,tone:'blue',custom:true};});
}

function normPhone(raw){
  let d=String(raw==null?'':raw).replace(/\D/g,'');
  if(d.length===13&&d.startsWith('091'))d=d.slice(3);
  else if(d.length===12&&d.startsWith('91'))d=d.slice(2);
  else if(d.length===11&&d.startsWith('0'))d=d.slice(1);
  return /^[6-9]\d{9}$/.test(d)?d:null;
}
const fmtPhone=p=>p?p.slice(0,5)+' '+p.slice(5):'';
const startOfDay=ts=>{const d=new Date(ts);d.setHours(0,0,0,0);return d.getTime();};
const fmtClock=ts=>new Date(ts).toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit',hour12:true}).toUpperCase();
const dayDiff=ts=>Math.round((startOfDay(ts)-startOfDay(Date.now()))/DAY);
const fmtDay=ts=>new Date(ts).toLocaleDateString('en-IN',{day:'numeric',month:'short'});
function fmtDT(ts){
  const k=dayDiff(ts),t=fmtClock(ts);
  if(k===0)return 'Today '+t;
  if(k===1)return 'Tomorrow '+t;
  if(k===-1)return 'Yesterday '+t;
  return fmtDay(ts)+', '+t;
}
function fmtWhen(ts){
  const k=dayDiff(ts),t=fmtClock(ts);
  if(k===0)return 'today at '+t;
  if(k===1)return 'tomorrow at '+t;
  if(k===-1)return 'yesterday at '+t;
  return 'on '+fmtDay(ts)+' at '+t;
}
function toLocalInput(ts){
  const d=new Date(ts),p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes());
}
function presets(now=Date.now()){
  const at=(days,h)=>{const x=new Date(now);x.setDate(x.getDate()+days);x.setHours(h,0,0,0);return x.getTime();};
  const out=[
    {k:'10m',label:'In 10 min',ts:now+10*MIN},
    {k:'1h',label:'In 1 hour',ts:now+HOUR},
    {k:'3h',label:'In 3 hours',ts:now+3*HOUR}
  ];
  if(at(0,17)-now>45*MIN)out.push({k:'5pm',label:'Today 5 PM',ts:at(0,17)});
  out.push(
    {k:'t10',label:'Tomorrow 10 AM',ts:at(1,10)},
    {k:'t4',label:'Tomorrow 4 PM',ts:at(1,16)},
    {k:'2d',label:'In 2 days',ts:at(2,10)},
    {k:'1w',label:'Next week',ts:at(7,10)}
  );
  return out;
}
// new (never dialed) | dialed (called, result not logged) | an OUTCOMES key
function statusOf(c){
  if(!c.calls.length)return 'new';
  const last=c.calls[c.calls.length-1];
  return last.outcome||'dialed';
}
// Returns null when it is fine to call, otherwise a warning to show first.
function guard(c,now=Date.now()){
  const st=statusOf(c);
  if(st==='new')return null;
  const last=c.calls[c.calls.length-1],o=OUTCOMES[st],when=fmtWhen(last.at);
  const n=c.calls.length>1?' You have called '+c.calls.length+' times.':'';
  if(o&&o.dnc)return{level:'block',title:'Do not call again',msg:'You already spoke to this number '+when+'. Reply: '+o.label+'.'+n};
  if(o&&o.final)return{level:'warn',title:'Already joined',msg:'This seller already joined Creavy. Last call was '+when+'.'+n};
  if(c.callbackAt&&c.callbackAt-now>15*MIN)return{level:'warn',title:'Callback is for later',msg:'This seller asked for a call '+fmtWhen(c.callbackAt)+'. Call now anyway?'};
  if(c.callbackAt)return null;
  return{level:'warn',title:'Already called',msg:'You called this number '+when+'.'+n+'\n'+(o?'Reply: '+o.label+'.':'Reply not logged yet.')+'\nCall again?'};
}
function parseBulk(text){
  return String(text||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(line=>{
    const m=line.match(/\+?\d[\d\s().-]{8,}\d/);
    if(!m)return{raw:line,phone:null,name:''};
    const phone=normPhone(m[0]);
    const name=line.replace(m[0],' ').replace(/[,;|\t]+/g,' ').replace(/\s+/g,' ').trim().slice(0,80);
    return{raw:line,phone,name};
  });
}
const icsEsc=s=>String(s==null?'':s).replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/([,;])/g,'\\$1');
const icsDT=ts=>new Date(ts).toISOString().replace(/[-:]|\.\d{3}/g,'');
function callDesc(c){
  const tg=c.tags||[];
  return ['Phone: +91 '+fmtPhone(c.phone),c.cbNote?'Talk about: '+c.cbNote:'',c.cat?'Makes: '+c.cat:'',tg.length?'Needs: '+tg.join(', '):'',c.notes?'Notes: '+c.notes.slice(0,300):''].filter(Boolean).join('\n');
}
function gcalURL(c){
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent('Call '+(c.name||fmtPhone(c.phone))+' (Creavy)')+
    '&dates='+icsDT(c.callbackAt)+'/'+icsDT(c.callbackAt+15*MIN)+'&details='+encodeURIComponent(callDesc(c));
}
// Calendar files wrap every line after 75 bytes: the rest continues on the next line, which starts with a space.
function icsFold(line){
  const enc=new TextEncoder(),out=[];
  let cur='',bytes=0;
  for(const ch of line){
    const n=enc.encode(ch).length;
    if(bytes+n>75){out.push(cur);cur=' ';bytes=1;}
    cur+=ch;bytes+=n;
  }
  out.push(cur);
  return out.join('\r\n');
}
function buildICS(list,now=Date.now()){

function cleanList(a,def){
  if(!Array.isArray(a))return def.slice();

  a.forEach(s=>{s=String(s==null?'':s).replace(/\s+/g,' ').trim().slice(0,50);const k=s.toLowerCase();if(s&&!seen.has(k)&&out.length<40){seen.add(k);out.push(s);}});

}

  if(!x||typeof x!=='object')return null;

  const num=v=>(isFinite(v)&&+v>0)?+v:null;
  const calls=Array.isArray(x.calls)?x.calls.filter(k=>k&&isFinite(k.at)).map(k=>({at:+k.at,outcome:isOutcome(k.outcome)?k.outcome:(/^x[a-z0-9]{3,16}$/.test(String(k.outcome))?'other':null)})):[];
  return{
    id:String(x.id||'').replace(/[^a-z0-9]/gi,'')||uid(),phone,
    name:String(x.name||'').slice(0,80),shop:String(x.shop||'').slice(0,80),city:String(x.city||'').slice(0,60),
    cat:String(x.cat||'').slice(0,60),
    tags:Array.isArray(x.tags)?x.tags.map(t=>String(t).trim().slice(0,60)).filter((t,i,a)=>t&&a.indexOf(t)===i).slice(0,20):[],
    notes:String(x.notes||'').slice(0,3000),addedAt:num(x.addedAt)||Date.now(),calls,
    callbackAt:num(x.callbackAt),cbNote:String(x.cbNote||'').slice(0,120),notifiedAt:num(x.notifiedAt),prevCb:num(x.prevCb),sample:x.sample===true
  };
}
function load(){
  try{
    const d=JSON.parse(localStorage.getItem(KEY)||'null');
    if(d&&Array.isArray(d.contacts)){
      const b=blank(),seen=new Set(),st=d.settings&&typeof d.settings==='object'?d.settings:{};
      if(typeof st.wa==='string')b.settings.wa=st.wa;
      b.settings.cats=cleanList(st.cats,DEFAULT_CATS);
      b.settings.tags=cleanList(st.tags,DEFAULT_TAGS);
      b.settings.custom=cleanCustom(st.custom);

      b.pending=d.pending||null;b.pendingShown=!!d.pendingShown;b.lastBackup=+d.lastBackup||0;
      return b;
    }
  }catch(e){}
  return blank();
}

function summary(){
  const now=Date.now(),sod=startOfDay(now),C=db.contacts;
  const calls=C.reduce((n,c)=>n+c.calls.filter(x=>x.at>=sod).length,0);
  const due=C.filter(c=>c.callbackAt&&c.callbackAt<=now).length;
  const wait=C.filter(c=>statusOf(c)==='new').length;
  const parts=[calls+(calls===1?' call':' calls')+' today'];
  if(due)parts.push(due+' due now');
  parts.push(wait+' waiting');
  return parts.join(', ');
}
function updateNav(){
  const now=Date.now();
  const due=db.contacts.filter(c=>c.callbackAt&&c.callbackAt<=now).length;
  const needs=db.contacts.filter(c=>statusOf(c)==='dialed').length;
  $$('nav button').forEach(b=>{
    const t=b.dataset.tab,em=$('em',b),n=t==='today'?due:t==='called'?needs:0;
    b.classList.toggle('on',t===view);
    em.textContent=n;em.hidden=!n;
  });
  $('#sum').textContent=summary();
  setBadge(due);
}
function render(){
  const y=window.scrollY;
  $('#view').innerHTML=({today:viewToday,queue:viewQueue,called:viewCalled,settings:viewSettings})[view]();
  if(view==='queue'||view==='called')renderList();
  $('#fab').hidden=view==='settings';
  updateNav();
  window.scrollTo(0,y);
}
function renderIfIdle(){
  const a=document.activeElement;
  if(view==='today'&&!sheet&&!dlgOpen&&!(a&&/INPUT|TEXTAREA/.test(a.tagName)))render();else updateNav();
}

function dial(phone){const a=document.createElement('a');a.href='tel:+91'+phone;document.body.appendChild(a);a.click();a.remove();}
function openLink(url){const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();}
function waText(c){
  return String(db.settings.wa||DEFAULT_WA).replace(/\{name\}/g,c.name||'').replace(/\s+([!,.])/g,'$1').replace(/[ \t]{2,}/g,' ').trim();
}
function openWA(id){
  const c=get(id);if(!c)return;
  openLink('https://wa.me/91'+c.phone+'?text='+encodeURIComponent(waText(c)));
}
function startCall(id,force){
  const c=get(id);if(!c)return;
  const g=guard(c);
  if(g&&!force){
    dialog({level:g.level,title:g.title,msg:g.msg,buttons:[{label:'Cancel',primary:true},{label:'Call anyway',danger:true,fn:()=>startCall(id,true)}]});
    return;
  }
  const last=c.calls[c.calls.length-1];
  if(last&&!last.outcome)last.at=Date.now();                  // the earlier call never got a result: reuse it
  else{c.prevCb=c.callbackAt||null;c.calls.push({at:Date.now(),outcome:null});}
  c.callbackAt=null;c.notifiedAt=null;
  db.pending=id;db.pendingShown=false;
  save();
  if(sheet)closeSheet();
  render();
  if(c.sample){db.pendingShown=true;save();toast('This is a sample seller, so your phone will not dial.',{ms:3500});openOutcome(id,'new');return;}
  dial(c.phone);
}

function checkPhone(){
  const el=$('#a_phone'),h=$('#a_hint');
  if(!el||!h)return;
  const v=el.value.trim();
  if(!v){h.innerHTML='';return;}
  const p=normPhone(v);
  if(!p){h.innerHTML='<div class="alert">'+(v.replace(/\D/g,'').length<10?'Keep typing. A mobile number has 10 digits.':'Enter a 10-digit mobile number that starts with 6, 7, 8 or 9.')+'</div>';return;}
  const ex=byPhone(p);
  h.innerHTML=ex?
    '<div class="alert '+((OUTCOMES[statusOf(ex)]||{}).dnc?'bad':'warn')+'"><b>Already in your list'+(ex.name?': '+esc(ex.name):'')+'</b><br>'+esc(statusText(ex))+'<br><button class="btn sm mt" data-act="open" data-id="'+ex.id+'">View this number</button></div>':
    '<div class="alert ok">New number: +91 '+fmtPhone(p)+'</div>';

function saveOne(thenCall){
  const p=normPhone($('#a_phone').value);
  if(!p){toast('Enter a 10-digit mobile number that starts with 6, 7, 8 or 9.');$('#a_phone').focus();return;}
  const ex=byPhone(p);
  if(ex){
    dialog({level:'warn',title:'Already in your list',msg:fmtPhone(p)+(ex.name?' ('+ex.name+')':'')+'\n'+statusText(ex),buttons:[{label:'Close',primary:true},{label:'View this number',fn:()=>openDetail(ex.id)}]});
    return;
  }
  sheet.cat=$('#a_cat').value;
  const c=makeContact(p,{name:$('#a_name').value,notes:$('#a_notes').value,cat:sheet.cat});
  db.contacts.push(c);save();
  if(thenCall){closeSheet();render();startCall(c.id);return;}
  ['#a_phone','#a_name','#a_notes'].forEach(s=>{$(s).value='';});
  $('#a_hint').innerHTML='';
  render();
  toast('Saved. Add the next number.');
  $('#a_phone').focus();
}

ACT.savemany=()=>{
  const items=parseBulk($('#a_many').value);
  if(!items.length){toast('Paste some numbers first.');return;}
  let added=0;const bad=[],dup=[],seen=new Set();
  items.forEach(it=>{
    if(!it.phone){bad.push(it.raw);return;}
    if(seen.has(it.phone)){dup.push({phone:it.phone,why:'repeated in what you pasted'});return;}
    seen.add(it.phone);
    const ex=byPhone(it.phone);
    if(ex){dup.push({phone:it.phone,why:info(statusOf(ex)).label});return;}
    db.contacts.push(makeContact(it.phone,{name:it.name}));added++;
  });
  save();render();
  const li=a=>a.map(x=>'<li>'+x+'</li>').join('');
  let h='<p><b>'+added+'</b> added to your Calling list.</p>';
  if(dup.length)h+='<p class="mt"><b>'+dup.length+'</b> skipped because they are already saved:</p><ul>'+li(dup.slice(0,8).map(d=>esc(fmtPhone(d.phone))+': '+esc(d.why)))+'</ul>'+(dup.length>8?'<p class="hint">and '+(dup.length-8)+' more</p>':'');
  if(bad.length)h+='<p class="mt"><b>'+bad.length+'</b> skipped because they are not valid mobile numbers:</p><ul>'+li(bad.slice(0,5).map(esc))+'</ul>'+(bad.length>5?'<p class="hint">and '+(bad.length-5)+' more</p>':'');
  if(added)$('#a_many').value='';
  dialog({title:'Numbers added',html:h,buttons:[{label:'OK',primary:true}]});
};

  $$('#layer .opt').forEach(b=>b.classList.toggle('sel',b.dataset.k===sheet.outcome));
  syncTimeBox();

};
ACT.saveout=()=>{
  const s=sheet,c=get(s.id);
  if(!c||!s.outcome)return;
  syncOutcomeInputs();
  const o=OUTCOMES[s.outcome],cb=o.final?null:s.cbAt;
  if(o.needsTime&&!cb){toast('Pick a time for the callback first.');return;}
  if(cb&&cb<Date.now()-MIN){toast('That time has passed. Pick a later time.');return;}
  c.name=s.name.trim().slice(0,80);c.notes=s.notes.trim().slice(0,3000);c.cat=s.cat;c.tags=s.tags.slice();c.cbNote=cb?s.cbNote.trim().slice(0,120):'';
  const last=c.calls[c.calls.length-1];
  if(s.mode==='complete'&&last&&!last.outcome)last.outcome=s.outcome;
  else if(s.mode==='fix'&&last)last.outcome=s.outcome;
  else c.calls.push({at:Date.now(),outcome:s.outcome});
  c.callbackAt=cb||null;c.notifiedAt=null;c.prevCb=null;
  if(db.pending===c.id)db.pending=null;
  save();closeSheet();render();
  if(cb)toast('Reminder set for '+fmtDT(cb),{action:{label:'Add to calendar',fn:()=>addToCalendar(c.id)},ms:6500});
  else toast('Saved');
  checkDue();
};
ACT.notcalled=()=>{
  const c=get(sheet.id);
  if(!c)return;
  const last=c.calls[c.calls.length-1];
  if(last&&!last.outcome)c.calls.pop();
  c.callbackAt=c.prevCb||null;c.prevCb=null;
  c.notifiedAt=c.callbackAt&&c.callbackAt<=Date.now()?Date.now():null;
  if(db.pending===c.id)db.pending=null;
  save();closeSheet();render();toast('Removed. That call was not counted.');
};

}

/* ================= REMINDERS ================= */
let actx=null;
function unlockAudio(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}}
function beep(){
  try{
    unlockAudio();
    const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;
    o.type='sine';o.frequency.value=880;o.connect(g);g.connect(actx.destination);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.25,t+0.03);g.gain.exponentialRampToValueAtTime(0.0001,t+0.5);
    o.start(t);o.stop(t+0.55);
  }catch(e){}
}
document.addEventListener('click',unlockAudio,{once:true});
function setBadge(n){
  try{
    if(!navigator.setAppBadge)return;
    const p=n>0?navigator.setAppBadge(n):navigator.clearAppBadge();
    if(p&&p.catch)p.catch(()=>{});
  }catch(e){}
}
async function sysNotify(c){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  const title='Call back '+dn(c);
  const body=[fmtPhone(c.phone),(c.cbNote||c.notes||'').replace(/\s+/g,' ').slice(0,90)].filter(Boolean).join('. ');
  const opt={body,tag:'cb-'+c.id,renotify:true,requireInteraction:true,vibrate:[250,120,250],icon:'icon-192.png',badge:'icon-192.png',data:{id:c.id}};
  try{
    const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();
    if(reg){await reg.showNotification(title,opt);return;}
  }catch(e){}
  try{new Notification(title,{body,tag:opt.tag});}catch(e){}
}
function checkDue(){
  const now=Date.now();
  const due=db.contacts.filter(c=>c.callbackAt&&c.callbackAt<=now);
  const fresh=due.filter(c=>!c.notifiedAt);
  if(fresh.length){
    fresh.forEach(c=>{c.notifiedAt=now;});
    save();
    try{if(navigator.vibrate)navigator.vibrate([250,120,250]);}catch(e){}
    beep();
    if(document.visibilityState==='visible'){
      if(fresh.length===1){const c=fresh[0];toast('Time to call back '+dn(c),{action:{label:'Open',fn:()=>openDetail(c.id)},ms:10000});}
      else toast(fresh.length+' callbacks are due',{action:{label:'View',fn:()=>{view='today';render();window.scrollTo(0,0);}},ms:10000});
    }else fresh.forEach(sysNotify);
  }
  if(fresh.length||due.length!==lastDue){lastDue=due.length;renderIfIdle();}
}
ACT.askalerts=async()=>{
  if(!('Notification' in window)){toast('This browser cannot show alerts.');return;}
  try{
    const r=await Notification.requestPermission();
    toast(r==='granted'?'Alerts are on.':'Alerts are blocked. Allow notifications for this site in your browser settings.',{ms:4000});
  }catch(e){toast('Could not turn on alerts.');}
  render();
};
ACT.testalert=()=>{
  if(!('Notification' in window)){toast('This browser cannot show alerts.');return;}
  if(Notification.permission!=='granted'){toast('Turn on alerts first.');return;}
  sysNotify({id:'test',name:'Test seller',phone:'9876543210',notes:'This is how a callback alert looks.'});
  toast('Test alert sent.');
};

/* ================= FILES: calendar, backup, CSV ================= */
function saveFile(name,text,type){
  try{
    if(navigator.standalone&&navigator.canShare&&window.File){
      const f=new File([text],name,{type});
      if(navigator.canShare({files:[f]})){navigator.share({files:[f]}).catch(()=>{});return;}
    }
  }catch(e){}
  const url=URL.createObjectURL(new Blob([text],{type}));
  const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),20000);
}
const ymd=()=>toLocalInput(Date.now()).slice(0,10);
function addToCalendar(id){
  const c=get(id);
  if(!c||!c.callbackAt)return;
  saveFile('creavy-call-'+c.phone+'.ics',buildICS([c]),'text/calendar');

}
ACT.cal=el=>addToCalendar(el.dataset.id);
ACT.gcal=el=>{const c=get(el.dataset.id);if(c&&c.callbackAt)openLink(gcalURL(c));};
ACT.icsall=()=>{

};
ACT.exportjson=()=>{

ACT.importjson=()=>$('#file').click();
$('#file').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0];
  e.target.value='';
  if(!f)return;
  const r=new FileReader();
  r.onload=()=>handleBackupText(String(r.result));
  r.readAsText(f);
});
function handleBackupText(text){
  try{
    const d=JSON.parse(text);
    if(Array.isArray(d)){importOldCRM(d);return;}               // backup from the older Creavy seller CRM
    if(!d||!Array.isArray(d.contacts))throw new Error('bad');
    // Reply options saved in the backup. They are switched on only while the file is read, so the replies
    // logged with them are not lost; they are kept for good only if you press Merge or Replace.
    const merged=db.settings.custom.slice(),have0=new Set(merged.map(o=>o.k));
    cleanCustom(d.settings&&d.settings.custom).forEach(o=>{if(!have0.has(o.k)&&merged.length<8){merged.push(o);have0.add(o.k);}});
    setCustom(merged);
    const list=d.contacts.map(normContact).filter(Boolean);
    setCustom(db.settings.custom);
    const keepReplies=()=>{db.settings.custom=merged;setCustom(merged);};
    if(!list.length)throw new Error('empty');
    dialog({title:'Restore backup',msg:'The backup has '+list.length+' numbers. You have '+db.contacts.length+' now.\n\nMerge adds only numbers you do not have yet. Replace deletes what is here first.',buttons:[
      {label:'Cancel'},
      {label:'Merge',primary:true,fn:()=>{
        keepReplies();
        const have=new Set(db.contacts.map(c=>c.phone));let n=0;
        list.forEach(c=>{if(!have.has(c.phone)){have.add(c.phone);db.contacts.push(c);n++;}});
        save();render();toast('Added '+n+' numbers.');
      }},
      {label:'Replace',danger:true,fn:()=>{
        keepReplies();
        const seen=new Set(),st=d.settings&&typeof d.settings==='object'?d.settings:{};
        db.contacts=list.filter(c=>!seen.has(c.phone)&&seen.add(c.phone));
        if(typeof st.wa==='string')db.settings.wa=st.wa;
        db.settings.cats=cleanList(st.cats,db.settings.cats);
        db.settings.tags=cleanList(st.tags,db.settings.tags);
        db.pending=null;save();render();toast('Backup restored.');
      }}]});
  }catch(err){toast('That file is not a Creavy backup.');}
}
/* The older Creavy seller CRM saves a plain list of sellers. Each becomes one number here, with its last reply. */
const OLD_STATUS={'Callback Requested':'callback','Interested':'interested','Docs Pending':'docs','No Answer':'noanswer','Onboarded':'joined','Do Not Call':'notint'};
const OLD_TAGS={'Needs Product Photo Help':DEFAULT_TAGS[0],'Needs Catalog / Price Upload':DEFAULT_TAGS[1],'No GST (Needs Enrolment ID)':DEFAULT_TAGS[2],'Has GSTIN Ready':DEFAULT_TAGS[3],'Check iThink Pincode Pickup':DEFAULT_TAGS[4],'Fragile Packaging Guidance':DEFAULT_TAGS[5],'Custom / Made-to-Order Items':DEFAULT_TAGS[6],'Wants WhatsApp Onboarding':DEFAULT_TAGS[7]};
const OLD_CATS={'Kantha Stitch & Embroidery':'Kantha & embroidery','Terracotta & Clay Craft':'Terracotta & clay craft','Handloom & Tant Sarees':"Women's wear & sarees",'Brass, Bell Metal & Dokra':'Brass, bell metal & Dokra','Wood, Bamboo & Cane':'Wood, bamboo & cane','Santiniketan Leather Goods':'Leather goods','Candles & Handcrafted Diyas':'Candles & diyas','Handmade Jewelry':'Jewelry & accessories','Personalized & Custom Gifts':'Personalized gifts','Other Artisan Product':'Other'};
function convertOld(arr){
  const list=[],bad=[],now=Date.now();
  const ts=v=>{const n=typeof v==='number'?v:Date.parse(v);return isFinite(n)&&n>0?n:null;};
  arr.forEach(s=>{
    if(!s||typeof s!=='object')return;
    const phone=normPhone(s.phone);
    if(!phone){bad.push(String(s.name||s.phone||'?').slice(0,40));return;}
    const lastAt=ts(s.lastCalledAt)||ts(s.createdAt)||now;
    const oc=Object.prototype.hasOwnProperty.call(OLD_STATUS,s.status)?OLD_STATUS[s.status]:null;
    const cbAt=ts(s.reminderAt);
    const cb=(oc==='callback'||(cbAt&&s.reminderDone===false))&&oc!=='notint'?cbAt:null;
    const hist=Array.isArray(s.history)?s.history:[];
    const earlier=hist.slice(0,-1).map(h=>{const t=h&&h.note?String(h.note).replace(/^\[[^\]]*\]\s*/,'').trim():'';return t?fmtDay(ts(h.at)||lastAt)+': '+t:'';}).filter(Boolean);
    const notes=String(s.notes||'')+(earlier.length?(s.notes?'\n\n':'')+'Earlier notes:\n'+earlier.join('\n'):'');
    list.push(normContact({phone,name:s.name,city:s.location,cat:OLD_CATS[s.category]||s.category,
      tags:Array.isArray(s.reqTags)?s.reqTags.map(t=>OLD_TAGS[t]||t):[],notes,addedAt:ts(s.createdAt)||lastAt,
      calls:[{at:lastAt,outcome:oc}],callbackAt:cb,cbNote:s.reminderNote,notifiedAt:cb&&cb<=now?now:null}));
  });
  return{list:list.filter(Boolean),bad};
}
function importOldCRM(arr){
  const r=convertOld(arr);
  if(!r.list.length)throw new Error('empty');
  const have=new Set(db.contacts.map(c=>c.phone));
  const fresh=r.list.filter(c=>!have.has(c.phone)),skipped=r.list.length-fresh.length;
  const extra=(skipped?'\n'+skipped+' already in your list, skipped.':'')+(r.bad.length?'\n'+r.bad.length+' without a valid mobile number, skipped.':'');
  if(!fresh.length){dialog({title:'Nothing new to add',msg:'Every seller in this file is already in your list.'+extra,buttons:[{label:'OK',primary:true}]});return;}
  dialog({title:'Older Creavy seller CRM',msg:'Found '+fresh.length+' sellers to add.'+extra+'\n\nEach one keeps its last reply, callback time, category, needs and notes.',buttons:[
    {label:'Cancel'},
    {label:'Add '+fresh.length,primary:true,fn:()=>{fresh.forEach(c=>db.contacts.push(c));save();render();toast('Added '+fresh.length+' sellers.');}}]});
}
ACT.wipe=()=>dialog({level:'block',title:'Delete all data?',msg:'All numbers, notes and call history on this phone will be removed. This cannot be undone.',buttons:[
  {label:'Cancel',primary:true},
  {label:'Delete everything',danger:true,fn:()=>{db=blank();setCustom([]);save();render();toast('All data deleted.');}}]});
/* Settings actions: your own replies, your lists, sample sellers */
ACT.addcustom=()=>{
  const el=$('#s_custom'),label=(el.value||'').replace(/\s+/g,' ').trim().slice(0,40);
  if(!label){toast('Type the reply first.');el.focus();return;}
  const low=label.toLowerCase();
  if(BUILTIN_LABELS.includes(low)||db.settings.custom.some(o=>o.label.toLowerCase()===low)){toast('You already have that reply.');return;}
  if(db.settings.custom.length>=8){toast('You can add up to 8 replies. Remove one you do not use.');return;}
  db.settings.custom.push({k:'x'+Date.now().toString(36).slice(-4)+Math.random().toString(36).slice(2,5),label});
  setCustom(db.settings.custom);save();render();toast('Added. It now shows when you log a reply.');
};
ACT.delcustom=el=>{
  const k=el.dataset.k;
  if(db.contacts.some(c=>c.calls.some(x=>x.outcome===k))){toast('That reply is in use, so it cannot be removed.');return;}
  db.settings.custom=db.settings.custom.filter(o=>o.k!==k);
  setCustom(db.settings.custom);save();render();
};
ACT.savelists=()=>{
  const lines=id=>$(id).value.split(/\r?\n/);
  db.settings.cats=cleanList(lines('#s_cats'),[]);
  db.settings.tags=cleanList(lines('#s_tags'),[]);
  save();render();toast('Lists saved.');
};
ACT.resetlists=()=>{db.settings.cats=DEFAULT_CATS.slice();db.settings.tags=DEFAULT_TAGS.slice();save();render();toast('The standard lists are back.');};
ACT.addsamples=()=>{
  const now=Date.now(),made=[];
  const mk=(phone,f,extra)=>{if(byPhone(phone))return;const c=makeContact(phone,f);c.sample=true;Object.assign(c,extra||{});made.push(c);};
  mk('9000000001',{name:'Rupa Das (sample)',cat:"Women's wear & sarees",notes:'Makes Kantha sarees and dupattas at home. Has photos on her phone.'},{tags:[DEFAULT_TAGS[0]]});
  mk('9000000002',{name:'Anwar Sheikh (sample)',cat:'Terracotta & clay craft',notes:'Spoke yesterday. He is at the market until Sunday.'},{tags:[DEFAULT_TAGS[5]],calls:[{at:now-26*HOUR,outcome:'callback'}],callbackAt:now+20*HOUR,cbNote:'Explain how fragile items are packed'});
  mk('9000000003',{name:'Meena Pal (sample)',cat:'Bags & clutches',notes:'Not interested right now.'},{calls:[{at:now-3*DAY,outcome:'notint'}]});
  if(!made.length){toast('The sample sellers are already in your list.');return;}
  made.forEach(c=>db.contacts.push(c));
  save();render();toast('Sample sellers added. Try calling Meena to see the warning.',{ms:5000});
};
ACT.rmsamples=()=>{
  db.contacts=db.contacts.filter(c=>!c.sample);
  if(db.pending&&!get(db.pending))db.pending=null;
  save();render();toast('Sample sellers removed.');
};
ACT.install=async()=>{
  if(!deferredInstall)return;

};
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;if(!sheet&&!dlgOpen)render();});
window.addEventListener('appinstalled',()=>{deferredInstall=null;toast('Installed.');render();});

/* ================= EVENTS ================= */
document.addEventListener('click',e=>{
  const t=e.target;
  if(t.classList&&t.classList.contains('backdrop')){if(t.closest('#dlgRoot'))closeDlg();else closeSheet();return;}
  const el=t.closest?t.closest('[data-act]'):null;
  if(!el)return;
  const fn=ACT[el.dataset.act];
  if(fn)fn(el,e);
});
document.addEventListener('input',e=>{
  const t=e.target,id=t.id;
  if(id==='a_phone')checkPhone();
  else if(id==='q'){if(view==='queue'){F.q=t.value;F.ql=100;}else{F.cq=t.value;F.cl=100;}renderList();}
  else if(id==='o_time'&&sheet){const ts=t.value?new Date(t.value).getTime():NaN;sheet.cbAt=isFinite(ts)?ts:null;markPicks('');updTimeSum();}
  else if(id==='s_wa'){db.settings.wa=t.value;save();}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(dlgOpen)closeDlg();else if(sheet)closeSheet();}
  else if(e.key==='Enter'&&e.target&&e.target.id==='a_phone'){e.preventDefault();saveOne(false);}
});
// Back in the app after a call: ask what happened.
function promptPending(){
  const id=db.pending;
  if(id&&!db.pendingShown&&get(id)&&!sheet&&!dlgOpen){db.pendingShown=true;save();openOutcome(id,'new');}
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden)return;
  checkDue();
  promptPending();
});
window.addEventListener('pageshow',e=>{if(e.persisted){checkDue();promptPending();}});

/* ================= START ================= */
function init(){
  if(history.state&&history.state.sheet){try{history.replaceState(null,'');}catch(e){}}
  const NAVIC={today:IC.clock,queue:IC.list,called:IC.done,settings:IC.sliders};
  $$('nav button').forEach(b=>{$('.ico',b).innerHTML=NAVIC[b.dataset.tab];});
  $('#fab').innerHTML=IC.plus+'Add numbers';
  render();
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
    navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.type==='open-cb'&&get(e.data.id))openDetail(e.data.id);});
  }
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  const p=new URLSearchParams(location.search);
  if(p.has('cb')||p.has('add')||p.has('tab')){try{history.replaceState(null,'',location.pathname);}catch(e){}}
  checkDue();
  if(p.get('cb')&&get(p.get('cb')))openDetail(p.get('cb'));
  else if(p.has('add'))openAdd('one');
  else if(p.get('tab')==='queue'){view='queue';render();}
  else promptPending();
  setInterval(checkDue,15000);
}
init();
